<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/ycrank/">
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YCRank</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#1a1815">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.9/dist/cdn.min.js" integrity="sha384-MEh8ZMZhsmD6/1Bd3kfTiGZoYIKR9u+BilQQWl5DOonh+pvKg6fP2AejtOozsZK8" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@17.0.5/lib/marked.umd.js" integrity="sha384-xitqJLqVApqEvkw/MVAOkioswwrPtXzz+I0mHqD0W2vQkcOVb3AEUOSxFsuJ8EgM" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.3/dist/purify.min.js" integrity="sha384-pcBjnGbkyKeOXaoFkmJiuR9E08/6gkmus6/Strimnxtl3uk0Hx23v345pWyC/MMr" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      theme: {
        screens: {
          'xs': '480px',
          'sm': '640px',
          'md': '768px',
          'lg': '1024px',
        },
        extend: {
          fontFamily: {
            sans: ['Inter', 'Segoe UI', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Consolas', 'monospace'],
          },
          colors: {
            claude: {
              bg: 'var(--c-bg)',
              panel: 'var(--c-panel)',
              text: 'var(--c-text)',
              orange: 'var(--c-accent)',
              'orange-deep': 'var(--c-accent-deep)',
              blue: 'var(--c-blue)',
              green: 'var(--c-green)',
              gray: 'var(--c-gray)',
              dim: 'var(--c-dim)',
              border: 'var(--c-border)',
              amber: 'var(--c-amber)',
              red: 'var(--c-red)',
              purple: 'var(--c-purple)',
              rose: 'var(--c-rose)',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="dashboard-page bg-claude-bg text-claude-text font-sans min-h-screen" x-data="app()">

  <!-- Top Nav -->
  <nav class="dashboard-nav border-b border-claude-border sticky top-0 z-50" aria-label="Main navigation">
    <div class="nav-inner px-3 py-2 flex items-center justify-between gap-2">
      <div class="nav-brand flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="nav-dots">
          <div class="nav-dot nav-dot-red"></div>
          <div class="nav-dot nav-dot-yellow"></div>
          <div class="nav-dot nav-dot-green"></div>
        </div>
        <h1 class="text-base font-bold text-claude-orange cursor-pointer sm:tracking-wider flex-shrink-0" @click="navigate('dashboard')">[YCRank]</h1>
        <span class="nav-separator text-claude-border">|</span>
        <select x-model="currentBatch" @change="selectBatch($event.target.value)" aria-label="Select YC batch"
          class="nav-batch bg-claude-bg border border-claude-border text-claude-orange px-1.5 sm:px-2 py-0.5 text-sm rounded-none focus:outline-none focus:border-claude-orange min-w-0 max-w-[140px] xs:max-w-none">
          <template x-for="b in batches" :key="b">
            <option :value="b" x-text="formatBatch(b)"></option>
          </template>
        </select>
      </div>
      <div class="nav-actions flex items-center gap-1 text-sm">
        <button @click="navigate('dashboard')"
          :class="view === 'dashboard' ? 'bg-claude-orange text-claude-bg px-1.5 sm:px-2 py-1.5' : 'text-claude-text hover:text-claude-orange px-1.5 sm:px-2 py-1.5'"
          class="transition-colors font-mono hidden sm:inline">Dashboard</button>
        <span class="text-claude-border hidden sm:inline">|</span>
        <button @click="navigate('analytics')"
          :class="view === 'analytics' ? 'bg-claude-orange text-claude-bg px-1.5 sm:px-2 py-1.5' : 'text-claude-text hover:text-claude-orange px-1.5 sm:px-2 py-1.5'"
          class="transition-colors font-mono hidden sm:inline">Analytics</button>
        <span class="text-claude-border hidden sm:inline">|</span>
        <span class="text-claude-gray px-1.5 sm:px-2 hidden sm:inline" x-show="manifest" x-text="manifest ? manifest.companyCount + ' companies' : ''"></span>
        <span class="text-claude-border hidden sm:inline">|</span>
        <a href="#" @click.prevent="logout()" class="text-claude-dim hover:text-claude-red px-1.5 sm:px-2 py-1.5 transition-colors font-mono">[logout]</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="dashboard-layout px-2 sm:px-3" x-ref="dashboardLayout"
    :class="{ 'dashboard-with-council': councilOpen && councilChatEnabled && !staticMode && !loading }">
  <main class="min-w-0 py-2 sm:py-3">

    <!-- Loading -->
    <div x-show="loading" class="text-center py-20 text-claude-orange terminal-blink">Loading_</div>

    <!-- No Build Data -->
    <div x-show="noBuildData && !loading" x-cloak class="text-center py-20">
      <p class="text-claude-orange text-lg font-mono mb-3">No build data found</p>
      <p class="text-claude-dim text-sm">Run the build pipeline to generate dashboard data:</p>
      <code class="block mt-2 text-claude-gray text-sm font-mono">powershell -ExecutionPolicy Bypass -File ycrank.ps1</code>
    </div>

    <!-- Search Bar (visible on dashboard + company) -->
    <div x-show="(view === 'dashboard' || view === 'company') && !loading && !noBuildData && manifest" x-cloak
      class="sticky-search flex items-center gap-2 py-2"
      :class="{ 'border-b border-claude-border': view === 'company' }"
      @click.outside="acOpen = false">
      <span class="text-claude-dim text-sm font-mono">&gt;&gt;</span>
      <div class="relative flex-1 min-w-0 sm:w-56 sm:flex-none">
        <input type="text" x-model.debounce.150ms="search" placeholder="search..." aria-label="Search companies"
          @focus="if (search) acOpen = true"
          @keydown="handleSearchKeydown($event)"
          class="bg-claude-bg border border-claude-border text-claude-text px-2 py-1 text-sm w-full focus:outline-none focus:border-claude-orange rounded-none placeholder-claude-dim font-mono">
        <button x-show="search" @click="search = ''" class="search-clear-btn absolute right-1.5 top-1/2 -translate-y-1/2 sm:hidden">&times;</button>
        <!-- Autocomplete dropdown -->
        <div x-show="acOpen && autocompleteResults.length > 0" class="ac-dropdown">
          <template x-for="(r, i) in autocompleteResults" :key="r.slug">
            <div class="ac-item" :class="{ 'ac-item-active': i === acIndex }"
              @mouseenter="acIndex = i"
              @mousedown.prevent="selectAutocomplete(r.slug)">
              <span class="ac-item-name" x-text="r.name"></span>
              <span class="ac-item-score" :class="avgColor(r.avg)" x-text="r.avg != null ? r.avg.toFixed(1) : '-'"></span>
            </div>
          </template>
        </div>
      </div>
      <template x-if="view === 'dashboard'">
        <div class="flex items-center gap-2">
          <span class="text-claude-border hidden sm:inline">|</span>
          <span class="text-claude-dim text-sm" x-text="filteredTable.length + '/' + (manifest ? manifest.table.length : 0) + ' companies'"></span>
          <span class="text-claude-border hidden sm:inline">|</span>
          <button @click="watchlistFilter = !watchlistFilter" x-show="!staticMode"
            :class="watchlistFilter ? 'text-claude-amber' : 'text-claude-dim hover:text-claude-amber'"
            class="text-sm transition-colors whitespace-nowrap">
            <span x-text="watchlistFilter ? '\u2605 Watchlist' : '\u2606 Watchlist'"></span>
          </button>
        </div>
      </template>
      <template x-if="view === 'company' && companyData">
        <div class="flex items-center gap-2 sm:gap-3 text-sm ml-auto">
          <button @click="prevCompany()" :disabled="!hasPrevCompany()"
            :class="hasPrevCompany() ? 'text-claude-text hover:text-claude-orange' : 'text-claude-dim cursor-not-allowed'">&lt;- Prev</button>
          <span class="text-claude-orange" x-text="'#' + (companyData.consolidatedRank || '?')"></span>
          <button @click="nextCompany()" :disabled="!hasNextCompany()"
            :class="hasNextCompany() ? 'text-claude-text hover:text-claude-orange' : 'text-claude-dim cursor-not-allowed'">Next -&gt;</button>
        </div>
      </template>
    </div>

    <!-- Dashboard View -->
    <div x-show="view === 'dashboard' && !loading && !noBuildData" x-cloak>

      <!-- Table (hidden on mobile, replaced by card view) -->
      <div class="dashboard-table-wrap hidden sm:block">
        <table class="w-full text-sm terminal-table dashboard-table">
          <thead class="sticky-thead">
            <tr class="border-b border-claude-border bg-claude-panel">
              <th class="px-1 py-1 text-center w-8 border border-claude-border cursor-pointer transition-colors"
                  :class="watchlistFilter ? 'text-claude-amber' : 'text-claude-gray hover:text-claude-amber'"
                  @click="watchlistFilter = !watchlistFilter"
                  :title="watchlistFilter ? 'Showing watchlist only (click to show all)' : 'Click to filter by watchlist'"
                  x-show="!staticMode"
                  x-text="watchlistFilter ? '\u2605' : '\u2606'"></th>
              <th class="dashboard-company-column px-1.5 py-1 text-left text-claude-gray cursor-pointer hover:text-claude-orange border border-claude-border whitespace-nowrap"
                @click="sortBy('name')">Company<span x-show="sortCol === 'name'" x-text="sortDir === 1 ? '\u25B2' : '\u25BC'" class="text-xs ml-0.5"></span>
              </th>
              <th class="px-1.5 py-1 text-center text-claude-gray cursor-pointer hover:text-claude-orange w-24 border border-claude-border whitespace-nowrap"
                @click="sortBy('revenue')"><span class="hidden sm:inline">Annual Revenue</span><span class="sm:hidden">ARR</span><span x-show="sortCol === 'revenue'" x-text="sortDir === 1 ? '\u25B2' : '\u25BC'" class="text-xs ml-0.5"></span>
              </th>
              <th class="px-1.5 py-1 text-center text-claude-gray cursor-pointer hover:text-claude-orange w-20 border border-claude-border whitespace-nowrap hidden lg:table-cell"
                @click="sortBy('memoDate')">Memo Date<span x-show="sortCol === 'memoDate'" x-text="sortDir === 1 ? '\u25B2' : '\u25BC'" class="text-xs ml-0.5"></span>
              </th>
              <th class="dashboard-partner-column px-1.5 py-1 text-left text-claude-gray cursor-pointer hover:text-claude-orange border border-claude-border whitespace-nowrap hidden lg:table-cell"
                @click="sortBy('ycPartner')">YC Partner<span x-show="sortCol === 'ycPartner'" x-text="sortDir === 1 ? '\u25B2' : '\u25BC'" class="text-xs ml-0.5"></span>
              </th>
              <template x-for="p in evaluators" :key="p.abbr">
                <th class="px-1.5 py-1 text-center text-claude-gray cursor-pointer hover:text-claude-orange w-10 border border-claude-border whitespace-nowrap hidden sm:table-cell"
                  @click="sortBy(p.abbr)"
                  :title="p.fullName"><span x-text="p.fullName"></span><span x-show="sortCol === p.abbr" x-text="sortDir === 1 ? '\u25B2' : '\u25BC'" class="text-xs ml-0.5"></span>
                </th>
              </template>
              <th class="px-1.5 py-1 text-center text-claude-gray cursor-pointer hover:text-claude-orange w-12 border border-claude-border whitespace-nowrap"
                @click="sortBy('avg')" title="Average thesis score">Avg<span x-show="sortCol === 'avg'" x-text="sortDir === 1 ? '\u25B2' : '\u25BC'" class="text-xs ml-0.5"></span>
              </th>
              <th class="px-1.5 py-1 text-center text-claude-gray cursor-pointer hover:text-claude-orange w-14 border border-claude-border whitespace-nowrap"
                @click="sortBy('teamSize')">Team Size<span x-show="sortCol === 'teamSize'" x-text="sortDir === 1 ? '\u25B2' : '\u25BC'" class="text-xs ml-0.5"></span>
              </th>
              <th class="px-1 py-1 text-center text-claude-gray cursor-pointer hover:text-claude-orange w-16 border border-claude-border whitespace-nowrap"
                @click="sortBy('tractionRank')" title="Traction stack-rank (Opus, memo-based)">Traction<span x-show="sortCol === 'tractionRank'" x-text="sortDir === 1 ? '▲' : '▼'" class="text-xs ml-0.5"></span>
              </th>
              <th class="dashboard-traction-details-column px-1.5 py-1 text-left text-claude-gray border border-claude-border whitespace-nowrap hidden lg:table-cell">Traction Details</th>
            </tr>
          </thead>
          <template x-for="row in filteredTable" :key="row.slug">
            <tbody>
              <tr class="border-b border-claude-border hover:bg-claude-panel cursor-pointer transition-colors"
                @click="row.slug && navigate('company/' + row.slug)">
                <td class="px-1 py-1 text-center border border-claude-border" x-show="!staticMode"
                    @click.stop="toggleWatchlist(row.slug, $event)">
                  <span :class="isWatchlisted(row.slug) ? 'text-claude-amber' : 'text-claude-dim hover:text-claude-amber'"
                    class="cursor-pointer text-sm transition-colors"
                    x-text="isWatchlisted(row.slug) ? '\u2605' : '\u2606'"></span>
                </td>
                <td class="px-1.5 py-1 border border-claude-border">
                  <div class="flex items-center gap-1.5">
                    <span class="dashboard-table-copy text-claude-text font-medium" x-text="row.name"></span>
                    <span x-show="isDisagreement(row.name)"
                      class="text-claude-red text-xs" :title="getKeyTension(row.name) || 'High disagreement (stddev >= 20)'">!!</span>
                  </div>
                  <div class="dashboard-table-copy text-xs text-claude-dim" x-text="row.oneLiner"></div>
                </td>
                <td class="px-1.5 py-1 text-center tabular-nums text-claude-dim border border-claude-border"
                  x-text="formatRevenue(row.revenue, row.hasSlide)"></td>
                <td class="px-1.5 py-1 text-center tabular-nums text-claude-dim border border-claude-border hidden lg:table-cell whitespace-nowrap"
                  x-text="formatMemoDate(row.memoDate)"></td>
                <td class="dashboard-table-copy px-1.5 py-1 text-claude-dim border border-claude-border hidden lg:table-cell"
                  x-text="row.ycPartner || '-'"></td>
                <template x-for="p in evaluators" :key="p.abbr">
                  <td class="px-1.5 py-1 text-center tabular-nums border border-claude-border hidden sm:table-cell"
                    :class="tierColor(row.tiers[p.abbr])"
                    :title="row.scoreTips && row.scoreTips[p.abbr] ? p.fullName + ': ' + row.scoreTips[p.abbr] : ''"
                    x-text="row.scores[p.abbr] != null ? row.scores[p.abbr] : '-'"></td>
                </template>
                <td class="px-1.5 py-1 text-center font-bold tabular-nums border border-claude-border"
                  :class="avgColor(row.avg)"
                  x-text="row.avg != null ? row.avg.toFixed(2) : '-'"></td>
                <td class="px-1.5 py-1 text-center tabular-nums text-claude-dim border border-claude-border"
                  x-text="row.teamSize != null ? row.teamSize : '-'"></td>
                <td class="px-1 py-1 text-center tabular-nums font-medium border border-claude-border"
                    :class="tractionRankColor(row.tractionRank)"
                    :title="row.tractionRank != null ? ('#' + row.tractionRank + ' by traction' + (row.tractionReason ? ' — ' + row.tractionReason : '')) : 'No traction rank'">
                  <span x-text="row.tractionRank != null ? ('#' + row.tractionRank) : '-'"></span>
                </td>
                <td class="dashboard-table-copy px-1.5 py-1 text-claude-dim border border-claude-border hidden lg:table-cell"
                  :title="row.tractionReason || ''"
                  x-text="row.tractionReason || '-'"></td>
              </tr>
            </tbody>
          </template>
        </table>
      </div>

      <!-- Mobile company list -->
      <template x-if="mobileLayout && view === 'dashboard' && !loading && !noBuildData">
        <section class="mobile-company-list" aria-label="Companies"
          :class="{ 'mobile-company-list-no-scores': !evaluators.length }">
          <div class="mobile-company-grid mobile-company-columns" aria-label="Sort companies">
            <button type="button" @click="sortBy('name')" :aria-pressed="sortCol === 'name'">Company</button>
            <template x-for="thesis in evaluators" :key="thesis.slug">
              <button type="button" @click="sortBy(thesis.abbr)" :aria-pressed="sortCol === thesis.abbr"
                :aria-label="'Sort by ' + thesis.fullName">
                <span class="mobile-thesis-label" x-text="thesis.fullName"></span>
                <span class="mobile-thesis-abbr" x-text="thesis.abbr === 'EXIT' ? 'Exit' : thesis.abbr"></span>
              </button>
            </template>
            <button type="button" @click="sortBy('tractionRank')" :aria-pressed="sortCol === 'tractionRank'"
              aria-label="Sort by traction rank"><span class="mobile-traction-label">Traction</span><span class="mobile-traction-abbr">Trac.</span><span aria-hidden="true" x-show="sortCol === 'tractionRank'" x-text="sortDir === 1 ? '↑' : '↓'"></span></button>
          </div>

          <template x-for="row in filteredTable" :key="row.slug">
            <article class="mobile-company-card" :class="{ 'is-expanded': expandedCompanySlug === row.slug }">
              <a class="mobile-company-memo" :href="'#company/' + row.slug"
                :aria-label="'Open ' + row.name + ' memo'">
                <div class="mobile-company-grid mobile-company-summary">
                  <h2 class="mobile-company-name" x-text="row.name"></h2>
                  <template x-for="thesis in evaluators" :key="thesis.slug">
                    <span class="mobile-company-number" :class="tierColor(row.tiers?.[thesis.abbr]).split(' ')[0]"
                      x-text="row.scores?.[thesis.abbr] ?? '–'"></span>
                  </template>
                  <span class="mobile-company-number" x-text="row.tractionRank == null ? '–' : '#' + row.tractionRank"></span>
                </div>
                <p class="mobile-company-description" x-show="row.oneLiner" x-text="row.oneLiner"></p>

                <template x-if="expandedCompanySlug === row.slug">
                  <div class="mobile-company-details" :class="{ 'has-watchlist': !staticMode }">
                    <dl class="mobile-company-facts">
                      <div><dt>Team</dt><dd x-text="row.teamSize ?? '–'"></dd></div>
                      <div><dt>YC partner</dt><dd x-text="row.ycPartner || '–'"></dd></div>
                      <div><dt>ARR</dt><dd x-text="reportedArr(row.tractionReason) || '–'"></dd></div>
                    </dl>
                    <p class="mobile-company-evidence" x-show="row.tractionReason" x-text="row.tractionReason"></p>
                    <p class="mobile-company-evidence text-claude-red" x-show="isDisagreement(row.name)" x-text="getKeyTension(row.name)"></p>
                    <p class="mobile-company-evidence" x-show="!staticMode && getPipelineStage(row.slug)"
                      :class="pipelineColor(getPipelineStage(row.slug))" x-text="pipelineBadge(getPipelineStage(row.slug))"></p>
                  </div>
                </template>
              </a>
              <button type="button" class="mobile-company-expand" @click="toggleCompanyPreview(row.slug)"
                :aria-expanded="expandedCompanySlug === row.slug"
                :aria-label="(expandedCompanySlug === row.slug ? 'Collapse ' : 'Expand ') + row.name + ' details'">
                <span aria-hidden="true"></span>
              </button>
              <template x-if="!staticMode && expandedCompanySlug === row.slug">
                <button type="button" class="mobile-company-star" @click="toggleWatchlist(row.slug, $event)"
                  :aria-label="'Watchlist ' + row.name" :aria-pressed="isWatchlisted(row.slug)"
                  x-text="isWatchlisted(row.slug) ? '★' : '☆'"></button>
              </template>
            </article>
          </template>
          <p class="mobile-company-empty" x-show="!filteredTable.length">No matching companies</p>
        </section>
      </template>
    </div>

    <!-- Company Detail View -->
    <div x-show="view === 'company' && !loading" x-cloak>
      <template x-if="companyData">
        <div>
          <div class="company-details">
          <!-- Header -->
          <div class="mb-4 mt-3">
            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <h2 class="min-w-0 break-words text-2xl font-bold text-claude-orange" x-text="companyData.name"></h2>
                  <button @click="toggleWatchlist(companyData.slug, $event)" x-show="!staticMode"
                    :class="isWatchlisted(companyData.slug) ? 'text-claude-amber' : 'text-claude-dim hover:text-claude-amber'"
                    class="text-xl transition-colors cursor-pointer"
                    x-text="isWatchlisted(companyData.slug) ? '\u2605' : '\u2606'"></button>
                </div>
                <p class="text-claude-dim text-sm mt-0.5" x-text="companyData.oneLiner"></p>
                <template x-if="isDisagreement(companyData?.name)">
                  <p class="text-claude-red text-xs mt-1" x-text="'Key tension: ' + getKeyTension(companyData?.name)"></p>
                </template>
              </div>
              <div class="flex-shrink-0 flex flex-wrap gap-2">
                <select @change="setPipelineStage(companyData.slug, $event.target.value)" x-show="!staticMode"
                  :value="getPipelineStage(companyData.slug)"
                  class="bg-claude-bg border border-claude-border text-sm px-2 py-1.5 rounded-none focus:outline-none focus:border-claude-orange"
                  :class="pipelineColor(getPipelineStage(companyData.slug))">
                  <option value="">No stage</option>
                  <option value="interested">Interested</option>
                  <option value="researching">Researching</option>
                  <option value="meeting">Meeting</option>
                  <option value="committed">Committed</option>
                  <option value="passed">Passed</option>
                </select>
                <button @click="draftEmail()" x-show="!staticMode"
                  class="px-2 sm:px-3 py-1.5 border border-claude-blue text-claude-blue hover:bg-claude-blue hover:text-claude-bg text-sm transition-colors rounded-none flex items-center gap-1.5">
                  <span class="hidden sm:inline">Send Email</span>
                  <span class="sm:hidden">Email</span>
                </button>
                <button @click="generateMeetingNotes()" x-show="!staticMode"
                  title="Generate meeting preparation using the investment theses"
                  class="px-2 sm:px-3 py-1.5 border border-claude-green text-claude-green hover:bg-claude-green hover:text-claude-bg text-sm transition-colors rounded-none flex items-center gap-1.5">
                  <span class="hidden sm:inline">Meeting Prep</span>
                  <span class="sm:hidden">Prep</span>
                </button>
              </div>
            </div>
            <div class="flex flex-wrap gap-1.5 mt-2">
              <template x-if="companyData.metadata.website">
                <a :href="companyData.metadata.website" target="_blank" rel="noopener"
                  class="text-xs border border-claude-blue text-claude-blue px-1.5 py-0.5 rounded-none hover:bg-claude-blue hover:text-claude-bg truncate max-w-[200px] sm:max-w-xs inline-block" x-text="companyData.metadata.website"></a>
              </template>
              <template x-if="companyData.metadata.yc_partner && companyData.metadata.yc_partner !== 'Not listed'">
                <span class="min-w-0 max-w-full break-words text-xs border border-claude-purple text-claude-purple px-1.5 py-0.5 rounded-none" x-text="'YC Partner: ' + companyData.metadata.yc_partner"></span>
              </template>
              <template x-if="companyData.memoGeneratedAt">
                <span class="text-xs border border-claude-border text-claude-dim px-1.5 py-0.5 rounded-none" x-text="'Memo: ' + formatDate(companyData.memoGeneratedAt)"></span>
              </template>
            </div>
          </div>

          <!-- Score Summary -->
          <div class="mb-4">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
              <template x-for="p in evaluators" :key="p.slug">
                <div class="score-card p-1.5 text-center"
                  :class="{ 'cursor-pointer': companyData.paths.evals[p.slug], 'score-card-active': activeTab === p.slug }"
                  :title="getScoreTip(companyData.slug, p.abbr)"
                  @click="companyData.paths.evals[p.slug] && loadTabContent(p.slug)">
                  <div class="text-xs text-claude-dim truncate" x-text="p.fullName"></div>
                  <div class="text-lg font-bold tabular-nums" :class="tierColor(companyData.evalScores[p.slug] ? companyData.evalScores[p.slug].tier : null)"
                    x-text="companyData.consolidatedScores[p.abbr] != null ? companyData.consolidatedScores[p.abbr] : '-'"></div>
                  <div class="text-xs text-claude-dim"
                    x-text="companyData.evalScores[p.slug] ? companyData.evalScores[p.slug].tier : ''"></div>
                </div>
              </template>
              <div class="score-card p-1.5 text-center">
                <div class="text-xs text-claude-orange">Avg</div>
                <div class="text-lg font-bold tabular-nums" :class="avgColor(companyData.consolidatedAvg)"
                  x-text="companyData.consolidatedAvg != null ? companyData.consolidatedAvg.toFixed(2) : '-'"></div>
                <div class="text-xs text-claude-dim" x-text="companyData.consolidatedRank ? '#' + companyData.consolidatedRank : ''"></div>
              </div>
            </div>
          </div>

          <!-- Demo Day Slide -->
          <div class="mb-4">
            <template x-if="companyData.slideImage">
              <div class="border border-claude-border overflow-hidden max-w-4xl mx-auto">
                <img :src="(staticMode ? '' : '../') + companyData.slideImage" :alt="companyData.name + ' demo day slide'"
                  class="w-full h-auto">
              </div>
            </template>
            <template x-if="!companyData.slideImage">
              <div class="border border-claude-border px-4 py-6 text-center text-claude-dim text-xs">
                <span class="text-sm">no slide</span>
              </div>
            </template>
          </div>

          <!-- Tabbed Content: Memo + Evals -->
          <div class="mb-4">
            <div class="flex border-b border-claude-border overflow-x-auto" role="tablist" aria-label="Company data tabs">
              <button @click="loadTabContent('memo')" role="tab"
                :aria-selected="activeTab === 'memo'"
                :class="activeTab === 'memo' ? 'bg-claude-orange text-claude-bg' : 'text-claude-text hover:text-claude-orange'"
                class="px-3 py-1.5 text-sm transition-colors rounded-none shrink-0">Memo</button>
              <template x-for="p in evaluators" :key="p.slug">
                <button @click="loadTabContent(p.slug)" role="tab"
                  :aria-selected="activeTab === p.slug"
                  x-show="companyData.paths.evals[p.slug]"
                  :class="activeTab === p.slug ? 'bg-claude-orange text-claude-bg' : 'text-claude-text hover:text-claude-orange'"
                  class="px-3 py-1.5 text-sm transition-colors rounded-none shrink-0" x-text="p.fullName"></button>
              </template>
            </div>
            <div class="border border-t-0 border-claude-border p-2 sm:p-4 overflow-x-auto" role="tabpanel" aria-label="Tab content">
              <div x-show="tabLoading" class="text-claude-orange text-sm terminal-blink" aria-live="polite">Loading_</div>
              <div x-show="!tabLoading" class="markdown-body" x-html="tabContent"></div>
            </div>
          </div>

          <!-- Annotations -->
          <div class="mb-4" x-show="!staticMode">
            <h3 class="text-sm text-claude-gray mb-1 uppercase tracking-wider">--- Notes ---</h3>

            <!-- Add annotation input -->
            <div class="flex gap-1.5 mb-2">
              <span class="text-claude-dim text-sm font-mono py-1">&gt;</span>
              <input type="text" x-model="annotationInput"
                @keydown.enter="addAnnotation()"
                placeholder="add a note..."
                class="flex-1 bg-claude-bg border border-claude-border text-claude-text px-2 py-1 text-sm focus:outline-none focus:border-claude-orange rounded-none placeholder-claude-dim">
              <button @click="addAnnotation()"
                :disabled="!annotationInput.trim()"
                :class="annotationInput.trim() ? 'text-claude-orange border-claude-orange hover:bg-claude-orange hover:text-claude-bg' : 'text-claude-dim border-claude-border cursor-not-allowed'"
                class="px-2 py-1 border text-sm transition-colors rounded-none">[add]</button>
            </div>

            <!-- Annotation list -->
            <div x-show="annotationsLoading" class="text-claude-dim text-xs terminal-blink">loading_</div>
            <template x-if="annotations.length > 0">
              <div class="space-y-1.5">
                <template x-for="(note, i) in annotations" :key="i">
                  <div class="border-l-2 border-claude-border pl-2 py-1">
                    <p class="text-sm text-claude-text" x-text="note.text"></p>
                    <div class="flex gap-2 text-[10px] text-claude-dim mt-0.5">
                      <span x-text="formatAnnotationTime(note.ts)"></span>
                      <span x-text="note.user ? note.user.slice(0, 8) + '...' : ''"></span>
                    </div>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="!annotationsLoading && annotations.length === 0">
              <p class="text-claude-dim text-xs">No notes yet.</p>
            </template>
          </div>
          </div>

        </div>
      </template>
    </div>

    <!-- Analytics View -->
    <div x-show="view === 'analytics' && !loading" x-cloak>
      <h2 class="text-lg font-bold mb-4 text-claude-orange">--- Analytics ---</h2>

      <!-- Disagreement Highlights -->
      <template x-if="manifest && manifest.disagreements.length > 0">
        <div class="mb-6">
          <h3 class="text-sm font-bold mb-1 text-claude-red">&gt;&gt; Disagreement Highlights</h3>
          <p class="text-claude-dim text-[10px] mb-2">Companies whose thesis scores diverge most (standard deviation ≥ 20).</p>
          <div class="overflow-x-auto">
          <table class="w-full text-sm terminal-table">
            <thead>
              <tr class="border-b border-claude-border">
                <th class="px-1.5 py-1 text-left text-claude-gray border border-claude-border">Company</th>
                <th class="px-1.5 py-1 text-center text-claude-gray border border-claude-border">Avg</th>
                <th class="px-1.5 py-1 text-center text-claude-gray border border-claude-border">StdDev</th>
                <th class="px-1.5 py-1 text-left text-claude-gray border border-claude-border">High</th>
                <th class="px-1.5 py-1 text-left text-claude-gray border border-claude-border">Low</th>
                <th class="px-1.5 py-1 text-left text-claude-gray border border-claude-border">Key Tension</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="d in manifest.disagreements" :key="d.company">
                <tr class="border-b border-claude-border">
                  <td class="px-1.5 py-1 text-claude-text font-medium border border-claude-border" x-text="d.company"></td>
                  <td class="px-1.5 py-1 text-center tabular-nums text-claude-orange border border-claude-border" x-text="d.avg.toFixed(2)"></td>
                  <td class="px-1.5 py-1 text-center tabular-nums text-claude-red border border-claude-border" x-text="d.stddev.toFixed(2)"></td>
                  <td class="px-1.5 py-1 text-claude-green border border-claude-border" x-text="evaluatorScoreLabel(d.high)"></td>
                  <td class="px-1.5 py-1 text-claude-red border border-claude-border" x-text="evaluatorScoreLabel(d.low)"></td>
                  <td class="px-1.5 py-1 text-claude-dim text-[10px] border border-claude-border max-w-[300px]"
                    x-text="d.keyTension || ''" :title="d.keyTension || ''"></td>
                </tr>
              </template>
            </tbody>
          </table>
          </div>
        </div>
      </template>

      <!-- Convergence Warnings -->
      <template x-if="manifest && manifest.convergenceWarnings.length > 0">
        <div class="mb-6">
          <h3 class="text-sm font-bold mb-1 text-claude-amber">&gt;&gt; Convergence Warnings</h3>
          <p class="text-claude-dim text-[10px] mb-2">Companies whose thesis scores are all within 10 points.</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-0">
            <template x-for="c in manifest.convergenceWarnings" :key="c.company">
              <div class="border border-claude-border px-2 py-1 text-xs">
                <span class="text-claude-text" x-text="c.company"></span>
                <span class="text-claude-dim ml-1" x-text="'(' + c.avg.toFixed(2) + ')'"></span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Correlation Matrix -->
      <template x-if="manifest && manifest.correlationMatrix.length > 0">
        <div class="mb-6">
          <h3 class="text-sm font-bold mb-1 text-claude-blue">&gt;&gt; Thesis Correlation Matrix</h3>
          <p class="text-claude-dim text-[10px] mb-2">Pearson r between thesis scores across companies.</p>
          <div class="overflow-x-auto">
            <table class="text-sm terminal-table">
              <thead>
                <tr class="border-b border-claude-border">
                  <th class="px-2 py-1 border border-claude-border"></th>
                  <template x-for="p in evaluators" :key="'corr-h-'+p.abbr">
                    <th class="px-2 py-1 text-center text-claude-gray border border-claude-border" x-text="p.fullName"></th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in manifest.correlationMatrix" :key="row.evaluator">
                  <tr class="border-b border-claude-border">
                    <td class="px-2 py-1 font-bold text-claude-text border border-claude-border" x-text="evaluatorName(row.evaluator)"></td>
                    <template x-for="p in evaluators" :key="'corr-'+row.evaluator+'-'+p.abbr">
                      <td class="px-2 py-1 text-center tabular-nums border border-claude-border"
                        :class="corrColor(row.values[p.abbr])"
                        x-text="row.values[p.abbr] != null ? row.values[p.abbr].toFixed(2) : '--'"></td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>
    </div>

  </main>
          <template x-if="councilChatEnabled && !staticMode && councilChatThread">
            <aside id="ycrank-assistant" x-ref="councilPanel" x-show="councilOpen" class="company-chat" aria-label="YCRank Assistant">
              <header class="company-chat-header">
                <div>
                  <h2 class="text-sm font-bold text-claude-orange">YCRank Assistant</h2>
                  <p class="text-xs text-claude-gray mt-1">GPT-6.1 Sol · Medium</p>
                </div>
                <button type="button" @click="clearCouncilChat()" :disabled="councilChatThread.asking || !councilChatThread.messages.length"
                  class="text-xs text-claude-gray disabled:opacity-40" aria-label="Clear conversation">Clear</button>
                <button type="button" @click="toggleCouncil()" class="text-xs text-claude-gray" aria-label="Collapse YCRank Assistant">Collapse</button>
              </header>
              <p class="company-chat-context text-xs text-claude-gray" x-text="councilCompany ? councilCompany.name : formatBatch(currentBatch)"></p>
              <div class="company-chat-messages" x-ref="councilChatMessages" role="log" aria-label="Conversation" aria-live="polite" :aria-busy="councilChatThread.asking">
                <p x-show="!councilChatThread.messages.length" class="text-sm text-claude-dim">Ask about a thesis, compare companies, or dig into the saved evaluations.</p>
                <template x-for="(message, index) in councilChatThread.messages" :key="index">
                  <div class="company-chat-message" :class="{ 'company-chat-user': message.role === 'user' }">
                    <p class="text-xs text-claude-gray mb-1" x-text="message.role === 'user' ? 'You' : 'Assistant'"></p>
                    <template x-if="message.role === 'user'"><p class="whitespace-pre-wrap text-sm break-words" x-text="message.content"></p></template>
                    <template x-if="message.role === 'assistant'"><div class="markdown-body" x-html="renderChatAnswer(message.content)"></div></template>
                  </div>
                </template>
                <p x-show="councilChatThread.asking" class="text-sm text-claude-orange" role="status">Thinking…</p>
              </div>
              <form class="company-chat-compose" @submit.prevent="sendCouncilChat()">
                <p x-show="councilChatThread.error" x-text="councilChatThread.error" class="text-xs text-claude-red mb-2" role="alert"></p>
                <label class="sr-only" for="company-chat-question">Ask YCRank Assistant</label>
                <textarea id="company-chat-question" x-ref="councilChatInput" x-model="councilChatThread.input" maxlength="8000" rows="3"
                  placeholder="Ask a question…" @keydown.enter="if (!$event.shiftKey && !$event.isComposing) { $event.preventDefault(); sendCouncilChat(); }"></textarea>
                <div class="flex items-center justify-between gap-2 mt-2">
                  <span class="text-xs text-claude-dim" x-text="councilChatThread.asking ? 'You can draft your next question while I think.' : 'Enter to send · Shift+Enter for a new line'"></span>
                  <button type="submit" :disabled="councilChatThread.asking || !councilChatThread.input.trim()" class="company-chat-send">Send</button>
                </div>
              </form>
            </aside>
          </template>
  </div>

  <button type="button" x-ref="councilDock" x-cloak x-show="!councilOpen && councilChatEnabled && !staticMode && councilChatThread"
    @click="toggleCouncil()" aria-expanded="false" aria-controls="ycrank-assistant" class="council-dock">
    <span>YCRank Assistant</span>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="m4 10 4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <!-- Status Footer -->
  <div class="status-footer">
    <span>v2.0</span>
    <span style="color:var(--c-border)">|</span>
    <span class="sf-dot"></span>
    <span>systems online</span>
    <template x-if="buildMeta">
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <span style="color:var(--c-border)">|</span>
        <span x-text="'built ' + formatDate(buildMeta.builtAt)"></span>
        <template x-if="buildMeta.costs && buildMeta.costs.total > 0">
          <span>
            <span style="color:var(--c-border)">|</span>
            <span x-text="'$' + buildMeta.costs.total.toFixed(2) + ' pipeline cost'"></span>
          </span>
        </template>
      </span>
    </template>
  </div>

  <script src="app.js"></script>
</body>
</html>
